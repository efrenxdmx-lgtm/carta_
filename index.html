<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Lucesita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2b2b;--pink:#F7A8C8;--rose:#D6336C;--lilac:#CDB8F2;--s:clamp(72px,21vw,114px);--m:clamp(100px,30vw,150px)}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px;background-color:#FDEAF2;background-image:radial-gradient(#F7B6D2 1.5px,transparent 1.7px);background-size:24px 24px;font-family:"Patrick Hand","Segoe Print","Comic Sans MS",cursive;color:var(--ink);overflow-x:hidden}
.card{position:relative;width:100%;max-width:560px;background:#fff;border:3px solid var(--ink);border-radius:28px;box-shadow:7px 7px 0 var(--pink);padding:calc(var(--m) + 22px) clamp(26px,7vw,56px) calc(var(--s) + 22px)}
.card::before{content:"";position:absolute;inset:10px;border:2px dashed var(--lilac);border-radius:20px;pointer-events:none}
.pic{position:absolute;height:var(--s);width:auto;mix-blend-mode:multiply;user-select:none;-webkit-user-drag:none}
.tl{top:16px;left:16px}.tr{top:16px;right:16px}.bl{bottom:16px;left:16px}.br{bottom:16px;right:16px}
.top{height:var(--m);top:12px;left:50%;transform:translateX(-50%)}
h1{font-family:"Pacifico","Segoe Script",cursive;font-weight:400;font-size:clamp(2rem,9vw,3rem);line-height:1.15;color:var(--rose);text-align:center;margin:0;text-shadow:3px 3px 0 #FFE9A8}
.squiggle{display:block;margin:8px auto 24px;width:126px}
p{font-size:clamp(1.25rem,4.6vw,1.5rem);line-height:1.55;margin:0 0 1em}
.hi{font-size:clamp(1.6rem,6vw,2rem);color:var(--rose);margin-bottom:.4em}
.drops{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.drop{position:absolute;top:0;width:auto;mix-blend-mode:multiply;opacity:.9;will-change:transform;animation:fall linear infinite}
@keyframes fall{from{transform:translate3d(0,-25vh,0) rotate(var(--r0))}to{transform:translate3d(var(--sx),118vh,0) rotate(var(--r1))}}
@media (prefers-reduced-motion:reduce){.drops{display:none}}
</style>
</head>
